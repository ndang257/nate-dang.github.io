---
layout: default
---
<article class="article-page">
  <a class="back-link" href="{{ '/projects/' | relative_url }}">← All projects</a>
  <p class="eyebrow">{{ page.category | default: "Project" }}</p>
  <h1>{{ page.title | escape }}</h1>
  <p class="article-intro">{{ page.summary | escape }}</p>
  <div class="article-meta">Project notes · {{ page.status | default: "In progress" }}</div>
  <div class="article-body">{{ content }}</div>
</article>
