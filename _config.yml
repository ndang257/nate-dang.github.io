title: Quang Ngoc Dang
description: Data science, thoughtful analysis, and notes from Berlin.
url: https://ndang257.github.io
baseurl: /nate-dang.github.io
email: dangquangoc@gmail.com
markdown: kramdown
permalink: /posts/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
