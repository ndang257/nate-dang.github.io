title: Quang Ngoc Dang
description: Aspiring Data Scientist
url: https://ndang257.github.io
baseurl: 
email: dangquangoc@gmail.com
markdown: kramdown
permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - vendor/