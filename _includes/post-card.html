<article class="content-card">
  <a class="card-link" href="{{ include.post.url | relative_url }}">
    <div class="card-art art-{{ include.post.visual | default: 'notes' }}" aria-hidden="true">
      <span class="art-label">FIELD NOTES</span>
      <span class="art-mark"></span>
    </div>
    <div class="card-copy">
      <p class="card-kicker">{{ include.post.date | date: "%b %-d, %Y" }} · {{ include.post.category | default: "Notes & ideas" }}</p>
      <h3>{{ include.post.title | escape }}</h3>
      <p>{{ include.post.excerpt | strip_html | escape }}</p>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </div>
  </a>
</article>
